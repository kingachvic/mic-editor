<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiC Scene Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F2EA">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23F5F2EA'/><path d='M3 22h8l3-4 3-14 3 22 3-8h6' fill='none' stroke='%231F4E9C' stroke-width='3' stroke-linejoin='round'/></svg>">
<style>
  :root { --paper:#F5F2EA; --card:#FFFDF8; --ink:#23211E; --muted:#6E6A63; --line:#DDD6C8; --blue:#1F4E9C; --red:#D2402F; --pink:#FF8FB1; --warn:#9A6B00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.4 Inter, system-ui, sans-serif; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; touch-action: manipulation; }
  button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .app { display: flex; flex-direction: column; min-height: 100%; overflow-x: hidden; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .logo { font-family: Lora, serif; font-size: 18px; }
  header .status:last-of-type { margin-right: auto; }
  .fname { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--card); font: inherit; width: 180px; }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok::before { content: '● '; color: #3F8F5A; } .status.bad { color: var(--red); cursor: pointer; } .status.bad::before { content: '● '; }
  main { display: flex; gap: 10px; padding: 10px; flex: 1; min-height: 0; }
  .code { flex: 1 1 44%; display: flex; flex-direction: column; min-width: 0; }
  .view { flex: 1 1 56%; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .codewrap { display: flex; flex: 1; min-height: 340px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .gutter { width: 42px; flex: none; overflow: hidden; font: 13px/20px ui-monospace, Menlo, monospace; padding: 8px 0; text-align: right; user-select: none; }
  .ln { padding-right: 8px; height: 20px; cursor: pointer; }
  .ln.cur { background: #E4DED0; color: var(--ink); }
  .ln.err { background: var(--red); color: #fff; } .ln.warn { box-shadow: inset 4px 0 #E2B23C; }
  .editarea { position: relative; flex: 1; min-width: 0; }
  .hl, .editarea textarea { position: absolute; inset: 0; margin: 0; padding: 8px 10px; font: 13px/20px ui-monospace, Menlo, Consolas, monospace; white-space: pre; tab-size: 2; letter-spacing: 0; font-variant-ligatures: none; }
  .hl { overflow: hidden; pointer-events: none; }
  .hl > div { min-height: 20px; margin: 0 -10px; padding: 0 10px; width: max-content; min-width: calc(100% + 20px); }
  .editarea textarea { width: 100%; height: 100%; border: 0; outline: 0; resize: none; background: transparent; color: transparent; overflow: auto; -webkit-text-fill-color: transparent; }
  .editarea textarea::selection { background: var(--sel); -webkit-text-fill-color: transparent; color: transparent; }
  .sugg { position: absolute; z-index: 5; min-width: 220px; max-width: 460px; border-radius: 6px; padding: 3px 0; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; box-shadow: 0 6px 18px #0004; }
  .sugg.dark { background: #252526; color: #CCCCCC; border: 1px solid #454545; } .sugg.light { background: #F3F3F3; color: #1F1F1F; border: 1px solid #C8C8C8; }
  .si { padding: 4px 10px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .sugg.dark .si.sel { background: #04395E; } .sugg.light .si.sel { background: #D6EBFF; }
  .si i { font-style: normal; font-size: 10px; width: 14px; text-align: center; border-radius: 3px; flex: none; }
  .k-verb { color: #C586C0; } .k-when { color: #569CD6; } .k-type, .k-point { color: #DCDCAA; } .sugg.light .k-type, .sugg.light .k-point { color: #795E26; }
  .k-object, .k-asset { color: #4EC9B0; } .k-option { color: #9CDCFE; } .sugg.light .k-option { color: #001080; } .k-value { color: #CE9178; }
  .si small { opacity: .6; overflow: hidden; text-overflow: ellipsis; font-family: Inter, sans-serif; }
  .transport button.play { background: var(--blue); color: #fff; border-color: var(--blue); }
  .transport button:disabled { opacity: .45; }
  .mine-bar, .mine-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .libtext { width: 100%; min-height: 300px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px/18px ui-monospace, Menlo, monospace; background: var(--card); white-space: pre; }
  .safe { margin: 10px 10px 0; padding: 10px 12px; border-radius: 8px; background: #FCE8E6; color: #7A1E14; font-size: 14px; }
  .safe button { margin-left: 8px; }
  .selbox { position: absolute; border: 2px dashed var(--blue); border-radius: 4px; pointer-events: none; }
  .selbox.fixedsel { border-color: var(--muted); }
  .handle { position: absolute; right: -11px; bottom: -11px; width: 20px; height: 20px; background: var(--blue); border: 2px solid #fff; border-radius: 4px; pointer-events: auto; cursor: nwse-resize; touch-action: none; }
  .ghform { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 12px; margin: 6px 0 8px; font-size: 13px; }
  .ghform label { display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
  .ghform input { font: 13px ui-monospace, monospace; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .snaps { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto; margin-bottom: 8px; }
  .snap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  .snaps > button { align-self: flex-start; }
  .narr { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-size: 13px; }
  .narr .rt { width: auto; padding: 0 6px 0 0; font-weight: 600; }
  .nw { padding: 2px 6px; font-size: 13px; border-radius: 5px; background: transparent; border-color: transparent; }
  .nw:hover, .nw:active { background: #E8E2D4; border-color: var(--line); }
  .subs { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); max-width: 92%; padding: 3px 10px; border-radius: 6px;
    background: rgba(35,33,30,.72); color: #F5F2EA; font: 600 clamp(11px, 1.6vw, 17px)/1.35 Inter, sans-serif; text-align: center; pointer-events: none; }
  .subs .said { opacity: .65; } .subs .now { color: #FFD866; }
  .filetabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .pname { color: var(--muted); margin-right: 2px; }
  .ftab { display: inline-flex; align-items: center; }
  .ftab > button:first-child { font: 13px ui-monospace, Menlo, monospace; padding: 4px 9px; }
  .ftab.on > button:first-child { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .fx { padding: 2px 7px; margin-left: 2px; font-size: 13px; }
  .fadd { padding: 3px 10px; font-weight: 700; }
  .themebtn { margin-left: 6px; font-size: 13px; padding: 4px 10px; }
  .msg { font-size: 13px; padding: 6px 4px; min-height: 30px; color: var(--muted); }
  .msg.bad { color: var(--red); } .msg.warnmsg { color: var(--warn); }
  .stage { position: relative; width: 100%; overflow: hidden; border-radius: 8px; background: transparent; }
  .transport { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .transport select { font: inherit; padding: 5px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
  .time { font-variant-numeric: tabular-nums; min-width: 96px; }
  .timeline { display: flex; flex-direction: column; gap: 4px; }
  .film, .lanes { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .film { height: 26px; }
  .lanes { height: 62px; }
  .beat { position: absolute; top: 2px; bottom: 2px; background: #E8E2D4; border-radius: 4px; font-size: 11px; padding: 3px 4px; overflow: hidden; white-space: nowrap; }
  .beat.cur { background: #D9D1BF; font-weight: 600; } .beat.audio::after { content: ' 🎙'; }
  .bar { position: absolute; height: 7px; background: var(--blue); border-radius: 3px; opacity: .55; margin-top: 4px; }
  .bar.bgline { opacity: .3; } .bar.cur { opacity: 1; outline: 2px solid var(--ink); } .bar.late { background: var(--red); opacity: .9; }
  .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); pointer-events: none; }
  .inspect { font-size: 13px; color: var(--ink); min-height: 40px; }
  .inspect code, .help code { background: #EAE4D6; border-radius: 4px; padding: 1px 4px; margin: 0 2px; cursor: pointer; font-size: 12px; }
  .hint { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; padding: 0 10px; }
  .tabs button { border-radius: 8px 8px 0 0; text-transform: capitalize; }
  .panel { border-top: 1px solid var(--line); padding: 8px 10px 40px; background: #FBF9F3; max-height: 42vh; overflow: auto; }
  .row { display: flex; gap: 8px; align-items: flex-start; margin: 3px 0; }
  .rt { width: 82px; flex: none; font-size: 12px; color: var(--muted); padding-top: 7px; text-align: right; }
  .rw { display: flex; flex-wrap: wrap; gap: 5px; }
  .w { padding: 5px 9px; font: 13px ui-monospace, Menlo, monospace; }
  .w i, .sw i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; border: 1px solid #0003; vertical-align: -1px; }
  .sw { margin-right: 10px; white-space: nowrap; }
  .search { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; margin-bottom: 8px; background: var(--card); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .thumb { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; }
  .thumb svg { width: 100%; height: 76px; }
  .thumb span { font: 10px ui-monospace, monospace; color: var(--muted); word-break: break-all; text-align: center; }
  .help { max-width: 980px; } .help table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .help td { border-bottom: 1px solid var(--line); padding: 5px 6px; vertical-align: top; } .help h2 { font-family: Lora, serif; font-size: 18px; margin: 16px 0 6px; }
  .help pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; overflow: auto; }
  .files button { margin: 4px 6px 4px 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  @media (max-width: 900px) { main { flex-direction: column; } .codewrap { min-height: 260px; } .view { order: -1; } }
</style>
</head>
<body><div id="root"></div><script src="app.js"></script></body>
</html>
